version: "3.8"

services:
  app:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
    networks:
      - higgsfield-network

  app-prod:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_JSON=true
    networks:
      - higgsfield-network
    restart: unless-stopped
    profiles:
      - production

networks:
  higgsfield-network:
    driver: bridge
