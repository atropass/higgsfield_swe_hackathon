name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check app tests

      - name: Run black
        run: black --check app tests

      - name: Run isort
        run: isort --check-only app tests

      - name: Run mypy
        run: mypy app

      - name: Run tests
        env:
          APP_API_KEY: test-key
          HF_API_KEY: test-hf-key
          HF_SECRET: test-hf-secret
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build --target production -t higgsfield-api:latest .

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-api -p 8000:8000 \
            -e APP_API_KEY=test-key \
            -e HF_API_KEY=test-hf-key \
            -e HF_SECRET=test-hf-secret \
            higgsfield-api:latest
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop test-api
